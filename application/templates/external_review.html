<!doctype html>
<html lang="en">
<head>
    <title>DARC Image Review | {{ data.reviewer }}</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="min-vh-100 d-flex flex-column">
    <div id="flash-messages-container">
        <div
            id="failedCommentFlash"
            class="alert alert-danger alert-dismissible px-5 mt-2 small text-center"
            style="position:fixed; left: 50%; transform: translate(-50%, 0); z-index: 1040; display: none;"
        >
            <span style="font-weight: 500;">Failed to save comments, please try again.</span>
            <br>
            <span>If the issue persists, please contact a DARC team member.</span>
            <button
                type="button"
                class="btn-close small"
                aria-label="Close"
                onclick="$('#failedCommentFlash')[0].style.display = 'none';"
            ></button>
            <div class="alert-bottom-bar alert-bottom-bar-success"></div>
        </div>
    </div>
    <!-- header -->
    <div class="py-3 px-4 px-md-5 d-flex justify-content-between sticky-top" style="background: var(--darc-bg); border-bottom: 1px solid var(--darc-bg-dark);">
        <div>
            <h3 class="mb-1" style="font-weight: 600;">DARC Image Review</h3>
            {{ data.reviewer }}
        </div>
        <div class="w-25 my-auto position-relative">
            <div class="progress w-100" style="height: 10px;">
                <div id="progressBarProgress" class="progress-bar rounded-1" role="progressbar" style="width: 0; background: #0085ad;"></div>
            </div>
            <div class="mt-1 text-end position-absolute" style="font-size: 0.75rem; right:0;">
                <span id="cardsReviewed">0</span> / <span id="totalCards">0</span> images reviewed
            </div>
        </div>
    </div>
    <!-- body -->
    <div class="mb-3 mx-4 mx-md-5 mb-5">
        {% if data.comments|length > 0 %}
        <div id="comments" class="col">
        </div>
        {% else %}
        No images found.
        {% endif %}
    </div>
    {% include 'footer.html' %}
    <div id="load-overlay" class="loader-bg-hidden">
        <div class="col d-flex justify-content-center">
            <div class="loader"></div>
        </div>
    </div>

    <script src="/static/js/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        const None = null;
        const True = true;
        const False = false;
        const reviewer = '{{ data.reviewer }}';
        const comments = {{ data.comments | safe }};
    </script>
    <script src="/static/js/reviewer-page.js" type="module"></script>
</body>
</html>
